# Robolectric configuration for the whole unit-test source set.
#
# conscryptMode=OFF
#   Robolectric otherwise installs Conscrypt's OpenSSL security provider during
#   setUpApplicationState(). The only published artifact,
#   org.conscrypt:conscrypt-openjdk-uber:2.5.2, ships native libraries for
#   linux-x86_64, osx-x86_64 and windows only - there is no aarch64 build. On any
#   ARM host (Apple Silicon Macs, aarch64 Linux CI) every Robolectric test
#   therefore dies with:
#     UnsatisfiedLinkError: no conscrypt_openjdk_jni-linux-aarch_64 in java.library.path
#   before a single test body runs. None of these unit tests exercise TLS, so the
#   JDK's built-in JSSE provider is sufficient and the suite becomes
#   architecture-independent.
conscryptMode=OFF
