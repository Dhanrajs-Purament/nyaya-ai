name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Triggers for tags like v1.9.2 or v1.9.2-nyaya

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # setup-gradle replaces the deprecated gradle-build-action and manages
      # Gradle caching itself, so no separate actions/cache step is needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APKs (with architecture splits)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        run: |
          echo "APK files built:"
          find app/build/outputs/apk/release -name "*.apk" -type f -exec ls -lh {} \;

      # Without keystore.properties on the runner these are UNSIGNED builds.
      # Signed store/sideload releases are produced by tools/release; this
      # workflow exists so a tag always yields reproducible CI artifacts.
      - name: Rename APKs for GitHub Release
        run: |
          cd app/build/outputs/apk/release
          for abi in arm64-v8a x86_64 universal; do
            for f in "app-$abi-release.apk" "app-$abi-release-unsigned.apk"; do
              if [ -f "$f" ]; then
                mv "$f" "Nyaya-AI-${{ github.ref_name }}-$abi.apk"
              fi
            done
          done
          ls -lh

      # Optional: Sign APKs (uncomment and configure secrets when ready)
      # - name: Sign APKs
      #   uses: r0adkll/sign-android-release@v1
      #   with:
      #     releaseDirectory: app/build/outputs/apk/release
      #     signingKeyBase64: ${{ secrets.SIGNING_KEY }}
      #     alias: ${{ secrets.ALIAS }}
      #     keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nyaya-ai-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/Nyaya-AI-*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: nyaya-ai-release-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Nyaya-AI-*.apk
          name: Nyaya AI ${{ github.ref_name }}
          draft: true
          body: |
            **Nyaya-AI-${{ github.ref_name }}-arm64-v8a.apk** — ARM64, most phones (recommended)
            **Nyaya-AI-${{ github.ref_name }}-x86_64.apk** — x86_64 (Chromebooks, emulators)
            **Nyaya-AI-${{ github.ref_name }}-universal.apk** — all architectures (fallback)

            > ⚠️ These are CI-built artifacts. Unless signing secrets are configured
            > for this repository, they are **unsigned** and will not install over a
            > signed release build. Draft release — review, attach signed APKs if
            > needed, and publish manually.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
